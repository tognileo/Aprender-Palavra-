<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudo | Aprender Palavras</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <span class="topo-marca">Aprender Palavras</span>
    <nav class="topo-menu">
      <a class="ativo" href="estudo.html">Estudar</a>
      <a href="minigames.html">Minigames</a>
      <span id="saudacao"></span>
      <button type="button" class="botao-contorno" id="botao-sair">Sair</button>
    </nav>
  </header>

  <main class="estudo">
    <div class="navegacao-grupo">
      <button type="button" class="seta" id="seta-voltar" aria-label="Grupo anterior" disabled>&#8249;</button>
      <div class="titulo-grupo">
        <p id="numero-grupo"></p>
        <h1 id="nome-grupo">Carregando...</h1>
      </div>
      <button type="button" class="seta" id="seta-avancar" aria-label="Próximo grupo" disabled>&#8250;</button>
    </div>

    <div class="abas">
      <button type="button" class="aba ativa" id="aba-estudar">Para estudar</button>
      <button type="button" class="aba" id="aba-memorizadas">Já memorizadas</button>
    </div>

    <div class="mensagem erro" id="mensagem" role="alert"></div>

    <div id="lista"></div>
  </main>

  <script src="js/script.js"></script>
  <script src="js/estudo.js"></script>
</body>
</html>
